<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ErvaLearn - Language Learning Tracker</title>
    <link
      rel="stylesheet"
      href="styles/node_modules/normalize.css/normalize.css"
    />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <div class="sidebar"></div>

    <div class="main-content">
      <div class="content-area">
        <div class="header"></div>

        <!-- Tab Content Containers -->
        <div class="tab-content">
          <!-- Home Tab (Overview) -->
          <div class="tab-pane active" data-tab="home">
            <div class="course-dash"></div>
            <div class="planning-section">
              <div class="planning-header">
                <div class="planning-title">Planning</div>
                <div class="view-all">View All</div>
              </div>
              <div class="schedule-grid"></div>
            </div>
          </div>

          <!-- Tests Tab -->
          <div class="tab-pane" data-tab="tests">
            <div class="test-cards-section"></div>
          </div>

          <!-- Dictionary Tab -->
          <div class="tab-pane" data-tab="dictionary">
            <div class="dictionary-section"></div>
          </div>
        </div>
      </div>

      <div class="stats-section"></div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
